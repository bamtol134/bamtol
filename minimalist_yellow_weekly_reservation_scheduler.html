<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>가게 손님 예약 관리 스케줄러</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #FFFDF0;
        }
        /* Custom smooth scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(217, 119, 6, 0.2);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(217, 119, 6, 0.4);
        }
        .ios-scroll {
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="text-zinc-800 min-h-screen flex flex-col antialiased selection:bg-amber-100">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-20 bg-[#FFFDF0]/95 backdrop-blur-md border-b border-amber-200/60 px-4 py-3 md:px-6">
        <div class="max-w-[1800px] mx-auto flex items-center justify-between gap-3">
            
            <!-- Date & Navigation -->
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1 bg-amber-100/50 p-1 rounded-xl border border-amber-200/50">
                    <button id="prevWeekBtn" class="p-1.5 rounded-lg text-amber-900 hover:bg-amber-200/60 active:scale-95 transition-all" title="이전 주">
                        <i data-lucide="chevron-left" class="w-5 h-5"></i>
                    </button>
                    <button id="todayBtn" class="px-3 py-1 rounded-lg bg-amber-500 text-white font-bold text-xs hover:bg-amber-600 active:scale-95 transition-all shadow-sm">
                        오늘
                    </button>
                    <button id="nextWeekBtn" class="p-1.5 rounded-lg text-amber-900 hover:bg-amber-200/60 active:scale-95 transition-all" title="다음 주">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                </div>
                <h1 id="weekTitle" class="text-base md:text-lg font-bold text-amber-950 flex items-center gap-2">
                    <!-- Dynamic Date Title -->
                </h1>
            </div>

            <!-- Header Info Summary -->
            <div class="hidden sm:flex items-center gap-3 text-xs font-medium text-amber-800/80 bg-amber-50 px-3 py-1.5 rounded-xl border border-amber-200/50">
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-500"></span> 예약 완료</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> 방문 완료</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-zinc-400"></span> 취소</span>
            </div>

        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 p-3 md:p-5 max-w-[1800px] w-full mx-auto flex flex-col">
        
        <!-- Weekly Grid Layout (7 Columns) -->
        <div id="weeklyGrid" class="grid grid-cols-1 md:grid-cols-7 gap-3 md:gap-3.5 flex-1">
            <!-- Day Columns Will Be Generated Dynamically -->
        </div>

    </main>

    <!-- Reservation Add Modal -->
    <div id="reservationModal" class="fixed inset-0 bg-black/30 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl border border-amber-200 shadow-xl max-w-md w-full p-5 space-y-4 animate-in fade-in zoom-in-95 duration-150">
            <div class="flex items-center justify-between border-b border-zinc-100 pb-3">
                <h3 class="font-bold text-zinc-900 text-base flex items-center gap-2">
                    <i data-lucide="calendar-plus" class="w-5 h-5 text-amber-600"></i>
                    <span id="modalDateTitle">예약 등록</span>
                </h3>
                <button onclick="closeModal()" class="text-zinc-400 hover:text-zinc-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="modalForm" onsubmit="handleSaveReservation(event)" class="space-y-3.5">
                <input type="hidden" id="modalDateKey">
                <input type="hidden" id="modalEditIndex" value="-1">

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-600 mb-1">방문 시간 *</label>
                        <input type="time" id="resTime" required
                            class="w-full px-3 py-2 text-sm bg-amber-50/50 rounded-xl border border-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-400 font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-600 mb-1">손님 성함 *</label>
                        <input type="text" id="resName" placeholder="홍길동" required
                            class="w-full px-3 py-2 text-sm bg-amber-50/50 rounded-xl border border-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-400 font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-600 mb-1">연락처</label>
                    <input type="tel" id="resPhone" placeholder="010-0000-0000"
                        class="w-full px-3 py-2 text-sm bg-amber-50/50 rounded-xl border border-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-400 font-medium">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-600 mb-1">인원 및 메모</label>
                    <textarea id="resNote" rows="2" placeholder="예: 2명 / 창가석 희망 / 메인요리 A 세트"
                        class="w-full px-3 py-2 text-sm bg-amber-50/50 rounded-xl border border-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-400 font-medium resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-600 mb-1">예약 상태</label>
                    <select id="resStatus" class="w-full px-3 py-2 text-sm bg-amber-50/50 rounded-xl border border-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-400 font-medium">
                        <option value="confirmed">예약 완료</option>
                        <option value="completed">방문 완료</option>
                        <option value="cancelled">취소됨</option>
                    </select>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-zinc-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-zinc-200 text-xs font-medium text-zinc-600 hover:bg-zinc-50">
                        취소
                    </button>
                    <button type="submit" class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold transition-all shadow-xs">
                        저장하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // App State
        let currentDate = new Date();
        let reservations = JSON.parse(localStorage.getItem('store_reservations')) || {};

        const DAY_NAMES = ['월', '화', '수', '목', '금', '토', '일'];

        // Helper: Get Monday of the week
        function getMonday(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        // Helper: Format Date key (YYYY-MM-DD)
        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Helper: Format Date Range
        function formatWeekRange(monday) {
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);

            const mYear = monday.getFullYear();
            const mMonth = monday.getMonth() + 1;
            const mDate = monday.getDate();

            const sMonth = sunday.getMonth() + 1;
            const sDate = sunday.getDate();

            // Week Number
            const firstDayOfMonth = new Date(mYear, mMonth - 1, 1);
            const weekNum = Math.ceil((monday.getDate() + (firstDayOfMonth.getDay() == 0 ? 6 : firstDayOfMonth.getDay() - 1)) / 7);

            return `${mYear}년 ${mMonth}월 ${weekNum}주차 <span class="text-xs font-normal text-amber-800/70">(${mMonth}.${mDate} ~ ${sMonth}.${sDate})</span>`;
        }

        // Render Planner
        function renderPlanner() {
            const monday = getMonday(currentDate);
            const todayKey = formatDateKey(new Date());

            document.getElementById('weekTitle').innerHTML = formatWeekRange(monday);

            const gridContainer = document.getElementById('weeklyGrid');
            gridContainer.innerHTML = '';

            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(monday);
                dayDate.setDate(monday.getDate() + i);
                const dateKey = formatDateKey(dayDate);
                const isToday = (dateKey === todayKey);
                
                // Sort reservations chronologically by time
                const dayResList = (reservations[dateKey] || []).sort((a, b) => a.time.localeCompare(b.time));

                // Day Column Card
                const col = document.createElement('div');
                col.className = `flex flex-col rounded-2xl border ${
                    isToday 
                    ? 'bg-[#FEF9C3] border-amber-400 ring-1 ring-amber-300' 
                    : 'bg-[#FFFEEA] border-amber-200/80'
                } p-3 transition-all`;

                col.innerHTML = `
                    <!-- Day Header -->
                    <div class="flex items-center justify-between pb-2 mb-2 border-b border-amber-200/60">
                        <div class="flex items-center gap-1.5">
                            <span class="text-sm font-bold ${i >= 5 ? (i === 5 ? 'text-blue-600' : 'text-red-500') : 'text-zinc-800'}">
                                ${DAY_NAMES[i]}요일
                            </span>
                            <span class="text-xs font-medium text-amber-800/70">
                                ${dayDate.getMonth() + 1}.${dayDate.getDate()}
                            </span>
                        </div>
                        <div class="flex items-center gap-1">
                            ${isToday ? `<span class="bg-amber-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-md">오늘</span>` : ''}
                            <span class="text-[11px] font-semibold text-amber-700 bg-amber-100/70 px-1.5 py-0.5 rounded-md">${dayResList.length}건</span>
                        </div>
                    </div>

                    <!-- Add Button -->
                    <button onclick="openModal('${dateKey}')" class="w-full mb-2.5 py-1.5 px-2 bg-white/80 hover:bg-white rounded-xl border border-amber-200 text-xs font-semibold text-amber-900 flex items-center justify-center gap-1 transition-all active:scale-98">
                        <i data-lucide="plus" class="w-3.5 h-3.5 text-amber-600"></i> 새 예약 등록
                    </button>

                    <!-- Reservation List -->
                    <div id="list-${dateKey}" class="flex-1 overflow-y-auto space-y-2 min-h-[160px] max-h-[420px] md:max-h-none pr-0.5 ios-scroll">
                        ${dayResList.length === 0 ? `
                            <div class="h-full flex flex-col items-center justify-center text-amber-800/30 py-8 text-xs">
                                예약이 없습니다
                            </div>
                        ` : ''}
                    </div>
                `;

                gridContainer.appendChild(col);

                // Render Reservation Items
                const listEl = document.getElementById(`list-${dateKey}`);
                if (dayResList.length > 0) {
                    listEl.innerHTML = '';
                    dayResList.forEach((res, index) => {
                        const itemEl = document.createElement('div');
                        
                        // Status styling
                        let statusBadge = '';
                        let cardBg = 'bg-white border-amber-200/90';
                        
                        if (res.status === 'completed') {
                            statusBadge = '<span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-200">방문완료</span>';
                            cardBg = 'bg-emerald-50/20 border-emerald-200/60 opacity-80';
                        } else if (res.status === 'cancelled') {
                            statusBadge = '<span class="text-[10px] font-bold text-zinc-500 bg-zinc-100 px-1.5 py-0.5 rounded border border-zinc-200">취소</span>';
                            cardBg = 'bg-zinc-50/50 border-zinc-200 opacity-60';
                        } else {
                            statusBadge = '<span class="text-[10px] font-bold text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded border border-amber-200">예약</span>';
                        }

                        itemEl.className = `p-2.5 rounded-xl border ${cardBg} transition-all space-y-1 group relative hover:border-amber-400`;

                        itemEl.innerHTML = `
                            <!-- Time & Status -->
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-bold text-amber-950 flex items-center gap-1">
                                    <i data-lucide="clock" class="w-3 h-3 text-amber-600"></i> ${escapeHtml(res.time)}
                                </span>
                                <div class="flex items-center gap-1">
                                    ${statusBadge}
                                </div>
                            </div>

                            <!-- Customer Info -->
                            <div class="flex items-baseline justify-between pt-0.5">
                                <span class="text-xs font-bold text-zinc-900">${escapeHtml(res.name)}</span>
                                ${res.phone ? `<a href="tel:${escapeHtml(res.phone)}" class="text-[11px] font-medium text-amber-800 hover:underline">${escapeHtml(res.phone)}</a>` : ''}
                            </div>

                            <!-- Note -->
                            ${res.note ? `<p class="text-[11px] text-zinc-600 bg-amber-50/60 p-1.5 rounded-lg border border-amber-100/80 leading-tight">${escapeHtml(res.note)}</p>` : ''}

                            <!-- Actions -->
                            <div class="flex items-center justify-between pt-1 border-t border-zinc-100 text-[10px]">
                                <!-- Status cycle button -->
                                <button onclick="cycleStatus('${dateKey}', ${index})" class="text-amber-800 hover:text-amber-950 font-medium flex items-center gap-0.5">
                                    <i data-lucide="refresh-cw" class="w-2.5 h-2.5"></i> 상태 변경
                                </button>
                                
                                <div class="flex items-center gap-2">
                                    <button onclick="openModal('${dateKey}', ${index})" class="text-zinc-400 hover:text-amber-600">
                                        <i data-lucide="pencil" class="w-3 h-3"></i>
                                    </button>
                                    <button onclick="deleteReservation('${dateKey}', ${index})" class="text-zinc-400 hover:text-red-600">
                                        <i data-lucide="trash-2" class="w-3 h-3"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                        listEl.appendChild(itemEl);
                    });
                }
            }

            lucide.createIcons();
        }

        // Helper: Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        // Modal Handlers
        window.openModal = function(dateKey, editIndex = -1) {
            document.getElementById('modalDateKey').value = dateKey;
            document.getElementById('modalEditIndex').value = editIndex;
            
            const dateObj = new Date(dateKey);
            document.getElementById('modalDateTitle').textContent = `${dateObj.getMonth() + 1}월 ${dateObj.getDate()}일 예약 ${editIndex >= 0 ? '수정' : '등록'}`;

            if (editIndex >= 0 && reservations[dateKey] && reservations[dateKey][editIndex]) {
                const item = reservations[dateKey][editIndex];
                document.getElementById('resTime').value = item.time || '';
                document.getElementById('resName').value = item.name || '';
                document.getElementById('resPhone').value = item.phone || '';
                document.getElementById('resNote').value = item.note || '';
                document.getElementById('resStatus').value = item.status || 'confirmed';
            } else {
                document.getElementById('modalForm').reset();
                document.getElementById('resTime').value = '12:00';
                document.getElementById('resStatus').value = 'confirmed';
            }

            document.getElementById('reservationModal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('reservationModal').classList.add('hidden');
        };

        window.handleSaveReservation = function(e) {
            e.preventDefault();
            const dateKey = document.getElementById('modalDateKey').value;
            const editIndex = parseInt(document.getElementById('modalEditIndex').value);

            const resData = {
                time: document.getElementById('resTime').value,
                name: document.getElementById('resName').value.trim(),
                phone: document.getElementById('resPhone').value.trim(),
                note: document.getElementById('resNote').value.trim(),
                status: document.getElementById('resStatus').value
            };

            if (!reservations[dateKey]) reservations[dateKey] = [];

            if (editIndex >= 0) {
                reservations[dateKey][editIndex] = resData;
            } else {
                reservations[dateKey].push(resData);
            }

            saveData();
            closeModal();
            renderPlanner();
        };

        window.cycleStatus = function(dateKey, index) {
            if (reservations[dateKey] && reservations[dateKey][index]) {
                const current = reservations[dateKey][index].status || 'confirmed';
                const nextMap = {
                    'confirmed': 'completed',
                    'completed': 'cancelled',
                    'cancelled': 'confirmed'
                };
                reservations[dateKey][index].status = nextMap[current];
                saveData();
                renderPlanner();
            }
        };

        window.deleteReservation = function(dateKey, index) {
            if (confirm('이 예약을 삭제하시겠습니까?')) {
                reservations[dateKey].splice(index, 1);
                if (reservations[dateKey].length === 0) delete reservations[dateKey];
                saveData();
                renderPlanner();
            }
        };

        function saveData() {
            localStorage.setItem('store_reservations', JSON.stringify(reservations));
        }

        // Navigation
        document.getElementById('prevWeekBtn').addEventListener('click', () => {
            currentDate.setDate(currentDate.getDate() - 7);
            renderPlanner();
        });

        document.getElementById('nextWeekBtn').addEventListener('click', () => {
            currentDate.setDate(currentDate.getDate() + 7);
            renderPlanner();
        });

        document.getElementById('todayBtn').addEventListener('click', () => {
            currentDate = new Date();
            renderPlanner();
        });

        window.onload = function() {
            renderPlanner();
        };
    </script>
</body>
</html>
